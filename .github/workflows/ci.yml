# Quality and DevSecOps gate: every push to main and every pull request must pass all jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend · build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      # Warnings are errors (Directory.Build.props), including NuGet vulnerability warnings.
      - run: dotnet build --no-restore -c Release
      # Integration tests start PostgreSQL with Testcontainers; the runner provides Docker.
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Frontend · lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dependencies:
    name: SCA · dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: NuGet (incluye transitivas)
        run: ./scripts/check-dependencies.sh nuget
      - name: npm
        run: ./scripts/check-dependencies.sh npm

  secrets:
    name: Secretos · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --verbose

  images:
    name: Contenedores · build y escaneo
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: toka-api
            context: .
            dockerfile: src/Toka.Api/Dockerfile
          - image: toka-web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ${{ matrix.image }}:ci -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: Trivy (falla con vulnerabilidades altas o críticas que ya tienen corrección)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E · docker compose + smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/init-env.sh
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: ./scripts/smoke.sh
      - name: Colección Postman (Newman) contra la API
        run: |
          docker run --rm --network toka-checkout_default -v "$PWD/postman:/etc/newman" postman/newman:6-alpine \
            run toka-checkout.postman_collection.json -e local.postman_environment.json \
            --env-var baseUrl=http://api:8080 --env-var "apiKey=$(grep '^API_KEY=' .env | cut -d= -f2)"
      - name: Logs si falla
        if: failure()
        run: docker compose logs
      - name: Limpieza
        if: always()
        run: docker compose down --volumes
