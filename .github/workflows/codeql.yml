# Static analysis (SAST). Findings appear in the repository's Security tab and fail the pull request check.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch new queries against unchanged code

permissions:
  contents: read
  # CodeQL reads its own workflow run to report results; without it the analyze step fails.
  actions: read
  security-events: write

jobs:
  analyze:
    name: SAST · ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
