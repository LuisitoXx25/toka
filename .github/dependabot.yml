# Weekly update pull requests; each one must pass CI before merging.
# Minor and patch updates are grouped into a single PR per ecosystem to keep the noise low;
# major versions still arrive as individual PRs because they may need code changes.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node runtime used to build (Node 24 LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/src/Toka.Api, /web]
    schedule: { interval: weekly }
    ignore:
      # Stay on the Node LTS line; odd/current majors are not used for builds.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ["*"]
