# Requires .env: run ./scripts/init-env.sh once, then `docker compose up --build`.
name: toka-checkout

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta .env. Ejecuta ./scripts/init-env.sh}
      TOKA_DB: toka
      TOKA_OWNER_PASSWORD: ${TOKA_OWNER_PASSWORD:?Falta .env. Ejecuta ./scripts/init-env.sh}
      TOKA_APP_PASSWORD: ${TOKA_APP_PASSWORD:?Falta .env. Ejecuta ./scripts/init-env.sh}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates toka_owner, toka_app and toka_corrections on first start (empty volume only).
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: during initialization postgres only listens on the unix socket, so this waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d toka"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # No published port: only the API reaches the database.

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: src/Toka.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Database=toka;Username=toka_app;Password=${TOKA_APP_PASSWORD}
      ConnectionStrings__Migrations: Host=db;Database=toka;Username=toka_owner;Password=${TOKA_OWNER_PASSWORD}
      Database__MigrateOnStartup: "true"
      Security__ApiKeys__0: ${API_KEY:?Falta .env. Ejecuta ./scripts/init-env.sh}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    tmpfs: ["/tmp"]
    ports:
      # Swagger and direct API access for local testing only (bound to localhost).
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for a readiness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    <<: *hardening
    build: ./web
    environment:
      API_UPSTREAM: http://api:8080
      API_KEY: ${API_KEY:?Falta .env. Ejecuta ./scripts/init-env.sh}
    # nginx renders its config from templates at startup and keeps runtime files in /tmp.
    # Owned by the image's non-root nginx user (uid 101); otherwise the templates cannot be written.
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
